name: Postman Collection Workflow

on:
  push:
    branches: [ main ]

  workflow_dispatch:

  schedule:
    - cron: '30 02 * * *'
    - cron: '00 14 * * *'
    - cron: '00 06 * * 1-5'

jobs:
  run-postman-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Newman and HTML Extra Reporter
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra

      - name: Run Postman Collection with Newman
        run: |
          mkdir -p newman
          newman run Inwaranty-flow.postman_collection.json \
            -e QA.postman_environment.json \
            -d TestData.csv \
            -r cli,htmlextra \
            --reporter-htmlextra-export newman/index.html

      - name: Upload Newman Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: newman/*.html

      - name: Publish Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: newman

      - name: Send Email Notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: Phoenix InWarranty Flow Execution Notification
          to: nareenkatkam53@gmail.com
          from: ${{ secrets.EMAIL_USERNAME }}
          body: |
            Hi,

            InWarranty flow tests have been executed successfully.

            Report URL:
            https://nareenk.github.io/Phoenix-InWarranty-Flow/
         
         
         
          
        
        
        
      
      
